<!doctype html>
<html lang="en" data-theme="luxury">

<head>
<meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Cult of the Lamb - Follower Tracker</title>
</head>


<body class="p-48 flex flex-col min-h-screen gap-4">
  <div id="app" class="flex flex-col gap-4">
    <h1 class="text-3xl font-bold text-primary">Cult of the Lamb Follower Tracker</h1>

    <button id="addFollowerButton" class="btn btn-primary">Add Follower</button>

<!-- 
****************************************************************************  
************************Follower List****************************************
****************************************************************************  
 -->
    <ul id="followerList" class="list-none p-0 w-full max-w-5xl grid grid-cols-3 gap-4">

      <!-- Followers will be dynamically added here -->
    </ul>


    <!-- 
****************************************************************************  
************************Add Follower****************************************
****************************************************************************  
 -->
  
  <dialog id="addFollowerModal" class="modal">
    <div class="modal-box w-full max-w-lg">
    <h3 class="text-xl font-bold mb-1 text-left">Add Follower</h3>

    <form id="addFollowerForm" class="flex flex-col gap-2">
        <label class="floating-label w-full m-2">
          <span class="label">Follower Name</span>
          <input type="text" name="name" placeholder="Follower Name" class="input w-full" required minlength="1" maxlength="30" />
        </label>
        <label class="input w-full m-2">
          <span class="label">Follower Level</span>
          <input type="number" name="level" placeholder="Level" class="input w-full" min="1" max="50" value="1" required />
        </label>
        <fieldset class="flex flex-col gap-1">
  <legend class="label">Skin</legend>
  <div id="skinPicker" class="grid grid-cols-4 gap-2 max-h-64 overflow-y-auto p-1"></div>
</fieldset>
        <label class="floating-label w-full m-2">
          <span class="label">Outfit</span>
          <input type="text" name="outfit" placeholder="Outfit" class="input w-full" required maxlength="30" />
        </label>
        <label class="floating-label w-full m-2">
          <select id="necklaceSelect" name="necklaceId" class="select w-full">
            <option value="">No necklace</option>
            <!-- Necklace options are added by main.ts -->
          </select>
        </label>
        <label class="floating-label w-full m-2">
          <select id="demonSelect" name="demonId" class="select w-full">
            <option value="">Select a demon</option>
            <!-- Demon options are added by main.ts -->
          </select>
        </label>
        <label class="label cursor-pointer justify-start gap-2">
          
          <input type="checkbox" name="isFavorite" class="checkbox" /> Favorite
        </label>
        <label class="label cursor-pointer justify-start gap-2">
          <input type="checkbox" name="isDead" class="checkbox" /> Dead
        </label>
      </div>

  <div class="modal-action">
    <button type="button" id="cancelAddFollowerButton" class="btn">Cancel</button>
    <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</form>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
